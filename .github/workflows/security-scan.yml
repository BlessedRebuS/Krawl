name: Security Scan

# No path filter: GitHub reports a skipped workflow's checks as *missing*
# rather than passing, which would make pull requests that touch no Python
# unmergeable against the required checks on main. The `changes` job gates the
# steps instead.
on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # security-checks always runs so its required status check always reports; it
  # just skips its steps when nothing relevant changed.
  changes:
    name: Detect relevant changes
    runs-on: self-hosted
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          BASE="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^src/.*\.py$|^requirements\.txt$|^pyproject\.toml$|^\.github/workflows/security-scan\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  security-checks:
    name: Security & Dependencies
    needs: changes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        if: ${{ needs.changes.outputs.code == 'true' }}

      # Self-hosted Debian runner: actions/setup-python can't fetch a prebuilt
      # Python for this distro, so use the interpreter already installed and
      # isolate installs in a venv (avoids PEP 668 / polluting the runner).
      # Prereq on the runner: python3 + python3-venv (matching 3.13).
      - name: Set up Python venv
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit security check
        id: bandit
        if: ${{ needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        run: |
          bandit -r src/ -f txt | tee "$RUNNER_TEMP/bandit-report.txt"

          SEVERITY_SECTION=$(sed -n '/Total issues (by severity):/,/Total issues (by confidence):/p' "$RUNNER_TEMP/bandit-report.txt")
          HIGH_COUNT=$(echo "$SEVERITY_SECTION" | grep "High:" | grep -o "[0-9]*" | head -1)

          if [ -z "$HIGH_COUNT" ]; then
            HIGH_COUNT=0
          fi

          echo "high_count=${HIGH_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "Found $HIGH_COUNT HIGH severity security issues"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "✓ No HIGH severity security issues found"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment Bandit findings on PR
        if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        env:
          BANDIT_REPORT_PATH: ${{ runner.temp }}/bandit-report.txt
          EXIT_CODE: ${{ steps.bandit.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bandit-report -->';
            const reportPath = process.env.BANDIT_REPORT_PATH;
            const hasFailed = process.env.EXIT_CODE !== '0';

            const report = fs.readFileSync(reportPath, 'utf8').trim();
            const summaryMatch = report.match(/Code scanned:[\s\S]*/);
            const summary = summaryMatch ? summaryMatch[0].trim() : '';
            const status = hasFailed
              ? 'HIGH severity issues were found. Review and fix them before merging.'
              : 'No HIGH severity issues found.';

            const body = `${marker}
            ### Bandit — security issues

            ${status}

            \`\`\`
            ${summary}
            \`\`\`

            <details>
            <summary>View full report</summary>

            \`\`\`
            ${report.slice(0, 60000)}
            \`\`\`

            </details>`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on HIGH severity issues
        if: ${{ needs.changes.outputs.code == 'true' && steps.bandit.outputs.exit_code != '0' }}
        run: exit 1

      - name: Dependency vulnerability audit
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          pip-audit -r requirements.txt || true