name: Fetch krawl ip banlist from demo and create PR
on:
  schedule:
    - cron: '0 9 * * 6'  # Runs every saturday at 9:00 AM
  workflow_dispatch:      # Allow manual trigger too
jobs:
  fetch-and-pr:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch data from API
        run: |
          curl -sf "${{ vars.BANLIST_URL }}" -o banlist.txt
          # deve essere roba vera: almeno 10 righe e tutte IP/CIDR
          lines=$(grep -cve '^[[:space:]]*$' banlist.txt || true)
          if [ "$lines" -lt 10 ]; then
            echo "Error: banlist too small ($lines lines)"
            exit 1
          fi
          if grep -ve '^[[:space:]]*$' banlist.txt | grep -qve '^[0-9a-fA-F:.]\+\(/[0-9]\+\)\?[[:space:]]*$'; then
            echo "Error: banlist contains non-IP lines"
            exit 1
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet banlist.txt && \
          ! git ls-files --others | grep -q -e '^banlist\.txt'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        env:
          HOME: ${{ runner.temp }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BANLIST_PAT || secrets.GITHUB_TOKEN }}
          title: 'Community banlist update'
          commit-message: Updated banlist
          branch: community-banlist-update
          body: |
            Updated community banlist
          reviewers: "carnivuth,Lore09"

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.BANLIST_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" -R "$GITHUB_REPOSITORY"
