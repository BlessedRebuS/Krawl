name: Fetch krawl ip banlist from demo and create PR
on:
  schedule:
    - cron: '0 9 * * 6'  # Runs every saturday at 9:00 AM
  workflow_dispatch:      # Allow manual trigger too
jobs:
  fetch-and-pr:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A GitHub App, not a PAT: the ruleset bypass that lets this merge without
      # a human approval is then scoped to an identity that can only ever do
      # what this workflow does, instead of to a person's whole account. The
      # token is minted per run and expires in an hour.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BANLIST_APP_ID }}
          private-key: ${{ secrets.BANLIST_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch data from API
        run: |
          curl -sf "${{ vars.BANLIST_URL }}" -o banlist.txt
          ./scripts/check_banlist.sh banlist.txt

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet banlist.txt && \
          ! git ls-files --others | grep -q -e '^banlist\.txt'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        env:
          HOME: ${{ runner.temp }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Must be the app that owns the token above, not github-actions[bot]:
          # the ruleset requires an extra approval for commits whose author does
          # not match the actor that pushed them. Left unset, peter-evans would
          # attribute the commit to github.actor, a human on a scheduled run.
          author: 'krawl-bot[bot] <332212842+krawl-bot[bot]@users.noreply.github.com>'
          committer: 'krawl-bot[bot] <332212842+krawl-bot[bot]@users.noreply.github.com>'
          title: 'Community banlist update'
          commit-message: Updated banlist
          branch: community-banlist-update
          body: |
            Updated community banlist
          labels: banlist
          reviewers: "carnivuth,Lore09"

      # GITHUB_TOKEN, not the app token: an actor cannot approve its own pull
      # request, and the app opened this one. github-actions[bot] is a separate
      # identity and its approval satisfies the required review count.
      - name: Approve
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}" \
            -R "$GITHUB_REPOSITORY" -b "Banlist validated by scripts/check_banlist.sh"

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}" -R "$GITHUB_REPOSITORY"
