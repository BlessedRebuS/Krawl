name: PR Checks

# No path filter: GitHub reports a skipped workflow's checks as *missing*
# rather than passing, which would make pull requests that touch no Python
# unmergeable against the required checks. The `changes` job gates the steps
# instead.
on:
  pull_request:
    branches:
      - dev

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # The jobs below always run so their required status checks always report;
  # they just skip their steps when nothing relevant changed.
  changes:
    name: Detect relevant changes
    runs-on: self-hosted
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          BASE="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '\.py$|^requirements\.txt$|^pyproject\.toml$|^Dockerfile$|^entrypoint\.sh$|^config\.yaml$|^\.github/workflows/pr-checks\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-test:
    name: Lint & Dependency Checks
    needs: changes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        if: ${{ needs.changes.outputs.code == 'true' }}
        with:
          # Check out the PR head branch itself (not the detached merge commit)
          # so we can commit auto-fixes back to it. Using the head repo/ref means
          # this also works for PRs opened from forks (read-only in that case).
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      # Self-hosted Debian runner: actions/setup-python can't fetch a prebuilt
      # Python for this distro, so use the interpreter already installed and
      # isolate installs in a venv (avoids PEP 668 / polluting the runner).
      # Prereq on the runner: python3 + python3-venv (matching 3.13).
      - name: Set up Python venv
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black pip-check-reqs ruff

      - name: Apply auto-fixes (ruff --fix & black)
        # Only auto-fix on same-repo PRs, where we can push the result back.
        # On fork PRs we skip this so the checks below validate the *submitted*
        # code rather than a locally-fixed tree (which would give a false pass).
        if: ${{ needs.changes.outputs.code == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          ruff check --fix src/ || true
          black src/

      - name: Commit & push auto-fixes
        id: autofix
        # GITHUB_TOKEN is read-only for PRs from forks, so we can only push back
        # to branches that live in this repository.
        if: ${{ needs.changes.outputs.code == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting/lint changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # "[skip ci]" stops this bot commit from re-triggering the PR workflow,
          # which would otherwise spawn a second run that needs maintainer approval.
          git commit -m "style: apply ruff --fix and black auto-fixes [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ruff lint & security check
        id: ruff
        if: ${{ needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        run: |
          ruff check src/ --output-format=grouped | tee "$RUNNER_TEMP/ruff-report.txt"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment Ruff findings on PR
        # GITHUB_TOKEN is read-only for fork PRs, so commenting would 403.
        # Skip on forks; the Ruff/Black/deps checks below still gate the PR.
        if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        env:
          RUFF_REPORT_PATH: ${{ runner.temp }}/ruff-report.txt
          EXIT_CODE: ${{ steps.ruff.outputs.exit_code }}
          PUSHED: ${{ steps.autofix.outputs.pushed }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ruff-report -->';
            const reportPath = process.env.RUFF_REPORT_PATH;
            const exitCode = process.env.EXIT_CODE;
            const hasFailed = exitCode !== '0';
            // 'pushed' is 'true' only when CI committed fixes back to this repo's
            // branch; it's empty for fork PRs (where CI can't push).
            const canPush = process.env.PUSHED === 'true' || process.env.PUSHED === 'false';
            const autofixNote = canPush
              ? 'Auto-fixable issues have already been fixed and pushed to this branch by CI (\`ruff --fix\` + \`black\`). The issues below **could not be fixed automatically** and must be addressed manually'
              : 'This PR appears to come from a fork, so CI could not push auto-fixes. Run \`ruff check --fix src/\` and \`black src/\` locally and push. The issues below also include ones that **cannot be fixed automatically**';

            let body;
            if (hasFailed) {
              const report = fs.readFileSync(reportPath, 'utf8').trim();
              body = `${marker}
            ### Ruff — lint & security issues

            ${autofixNote} (includes linting rules and security checks via \`S\` / Bandit rules).

            <details>
            <summary>View full report</summary>

            \`\`\`
            ${report.slice(0, 60000)}
            \`\`\`

            </details>

            **Tip:** pull the latest changes first (\`git pull\`), then try:
            \`\`\`sh
            ruff check --fix --unsafe-fixes src/
            \`\`\`
            and address any remaining \`S\` (security) findings manually.`;
            } else {
              body = `${marker}
            ### Ruff — lint & security issues

            No issues found.`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail Ruff check
        if: ${{ needs.changes.outputs.code == 'true' && steps.ruff.outputs.exit_code != '0' }}
        run: exit 1

      - name: Black format check
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: black --check src/

      - name: Check for unused requirements
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: |
          pip-missing-reqs src/
          pip-extra-reqs -r uvicorn -r psycopg2-binary src/

  build-docker:
    name: Build Docker
    needs: changes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        if: ${{ needs.changes.outputs.code == 'true' }}

      - name: Build Docker image
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: docker build -t krawl:test .