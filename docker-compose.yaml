---
# Scalable mode: Krawl + PostgreSQL + Redis
#
# Run from the repository root, where it picks up ./config.yaml and ./wordlists.json:
#   docker compose up -d
#
# The same stack with paths relative to docker/ lives in
# docker/docker-compose.scalable.yaml; standalone (SQLite, no external services) is
# docker/docker-compose.standalone.yaml. Development stacks that build from source
# with hot-reload are under docker/dev/.
#
# !! IMPORTANT: Change the default PostgreSQL and Redis passwords before deploying to production !!
services:
  postgres:
    image: postgres:16-alpine
    container_name: krawl-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: krawl
      POSTGRES_USER: krawl
      POSTGRES_PASSWORD: krawl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krawl -d krawl"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krawl-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### Default LLM service using llama.cpp. You can switch to Ollama or another LLM server by commenting/uncommenting the relevant sections below.
  ### Make sure to select the GGUF model file using the repo and file parameters in the command section: https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
  # llm:
  #   image: ghcr.io/ggml-org/llama.cpp:server
  #   container_name: krawl-llm
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - HF_TOKEN=${HF_TOKEN:-}
  #   volumes:
  #     - ./models:/models
  #     - llm_cache:/root/.cache
  #   restart: unless-stopped
  #   command: >
  #     --hf-repo Qwen/Qwen1.5-1.8B-Chat-GGUF # set your desired model here in the GGUF format
  #     --hf-file qwen1_5-1_8b-chat-q4_k_m.gguf
  #     --port 8080
  #     --host 0.0.0.0
  #     -n -1
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  ### ALTERNATIVE: Use Ollama instead of llama.cpp. Specify the model in the command section https://docs.ollama.com/docker#docker
  ### Remember to specify the "model" parameter also in the config.yaml file.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: krawl-llm
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - OLLAMA_MODELS=/models
  #     - OLLAMA_HOST=0.0.0.0:8080
  #   volumes:
  #     - ./models:/models
  #     - llm_cache:/root/.ollama
  #   restart: unless-stopped
  #   command: serve; ollama pull qwen1.5:1.8b; # set your desired model here
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/api/tags"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  krawl:
    image: ghcr.io/blessedrebus/krawl:latest
    container_name: krawl-server
    ports:
      - "5000:5000"
    environment:
      - CONFIG_LOCATION=config.yaml
      - KRAWL_MODE=scalable
      - KRAWL_POSTGRES_HOST=postgres
      - KRAWL_POSTGRES_PORT=5432
      - KRAWL_POSTGRES_USER=krawl
      - KRAWL_POSTGRES_PASSWORD=krawl
      - KRAWL_POSTGRES_DATABASE=krawl
      - KRAWL_REDIS_HOST=redis
      - KRAWL_REDIS_PORT=6379
      - KRAWL_DASHBOARD_WARMUP_AGGREGATION=true
      # Optional: path inside the container where a custom HTML template can be mounted
      - KRAWL_CUSTOM_TEMPLATE_PATH=/templates/custom_page.html
      # Uncomment to set a custom dashboard password (auto-generated if not set)
      # - KRAWL_DASHBOARD_PASSWORD=your-secret-password
      # Set this to change timezone
      # - TZ=Europe/Rome
      #
      # --- Banlist federation (docs/firewall-exporters.md) ---
      # Publish this instance's banlist on an unauthenticated path, and merge
      # lists pulled from other Krawl instances or any plain-text IP list.
      # - KRAWL_BANLIST_EXPORT_PATH=/public_banlist.txt
      # - KRAWL_BANLIST_SOURCES=https://demo.krawlme.com/das_dashboard/api/export-ips?categories=attacker&fwtype=raw
      # - KRAWL_BANLIST_REFRESH_INTERVAL=3600
      #
      # --- Tarpit (docs/tarpit.md) ---
      # Delay and pad every honeypot response to make crawling expensive.
      # Applies to all honeypot visitors, not only known-malicious IPs.
      # - KRAWL_TARPIT_ENABLED=true
      # - KRAWL_TARPIT_DELAY_SECONDS=5
      #
      # --- Cloudflare WAF sync (docs/cloudflare_banlist.md) ---
      # - KRAWL_CLOUDFLARE_ENABLED=true
      # - KRAWL_CLOUDFLARE_ACCOUNT_ID=your-account-id
      # - KRAWL_CLOUDFLARE_AUTH_TOKEN=your-api-token
      #
      # Never tracked, banned, exported or persisted; purged at startup.
      # Defaults cover loopback, RFC1918, link-local and CGNAT.
      # - KRAWL_IGNORED_IPS=10.0.0.0/8,192.168.0.0/16
      # - KRAWL_METRICS_ENABLED=true
      # - KRAWL_LOG_LEVEL=INFO
    volumes:
      - ./wordlists.json:/app/wordlists.json:ro
      - ./config.yaml:/app/config.yaml:ro
      # Optional: mount your custom template file to /templates/custom_page.html
      # - ./custom_page.html:/templates/custom_page.html:ro
      - ./logs:/app/logs
      - ./backups:/app/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  llm_cache: