<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Corp Admin Portal</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f5f6fa; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-container { background:#fff; padding:40px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.1); width:100%; max-width:400px; }
        h2 { text-align:center; margin-bottom:30px; color:#2c3e50; }
        .form-group { margin-bottom:20px; }
        label { display:block; margin-bottom:5px; font-weight:600; color:#34495e; }
        input[type="text"], input[type="password"] { width:100%; padding:12px; border:1px solid #ddd; border-radius:4px; font-size:16px; transition:border-color 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { outline:none; border-color:#3498db; box-shadow:0 0 0 2px rgba(52,152,219,0.2); }
        button { width:100%; padding:12px; background:#3498db; color:#fff; border:none; border-radius:4px; font-size:16px; font-weight:600; cursor:pointer; transition:background 0.3s; }
        button:hover { background:#2980b9; }
        .footer { margin-top:30px; text-align:center; font-size:14px; color:#7f8c8d; }
        .version { display:block; margin-top:10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Acme Corp Admin</h2>
        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="footer">
            Powered by AcmeOS v2.1.4<br>
            <span class="version">Server: 192.168.1.100 | DB: acme_admin</span>
        </div>
    </div>
</body>
</html>
