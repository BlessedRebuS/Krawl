<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Intranet Portal</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;display:flex;height:100vh;align-items:center;justify-content:center}
.login-box{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:320px}
h2{margin-top:0;color:#333;text-align:center}
.input-group{margin-bottom:15px}
.input-group label{display:block;margin-bottom:5px;font-weight:bold}
.input-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.btn{width:100%;padding:10px;background:#0066cc;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
.btn:hover{background:#004c99}
.footer{margin-top:20px;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="login-box">
<h2>Admin Panel</h2>
<div class="input-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter username">
</div>
<div class="input-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter password">
</div>
<button class="btn" onclick="login()">Sign In</button>
<div class="footer">
Powered by CorpNet Admin Suite v2.4.1<br>
Server: 192.168.10.25 &nbsp;|&nbsp; Database: corp_db
</div>
</div>
<script>
function login(){
var u=document.getElementById('username').value;
var p=document.getElementById('password').value;
if(u===''||p===''){
alert('Please fill in both fields');
return;
}
 // Simulate submission
alert('Login attempted for user: '+u);
}
</script>
</body>
</html>
