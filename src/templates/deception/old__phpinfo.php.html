<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpNet Admin Portal</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; background:#f4f6f9; margin:0; display:flex; align-items:center; justify-content:center; height:100vh;}
        .login-box {background:#fff; padding:30px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.1); width:320px;}
        h2 {margin-top:0; color:#2c3e50;}
        .input-group {margin-bottom:15px;}
        label {display:block; margin-bottom:5px; font-weight:bold; color:#34495e;}
        input[type="text"], input[type="password"] {width:100%; padding:10px; border:1px solid #bdc3c7; border-radius:4px; box-sizing:border-box;}
        button {width:100%; padding:10px; background:#2980b9; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px;}
        button:hover {background:#3498db;}
        .footer {margin-top:20px; font-size:12px; color:#7f8c8d; text-align:center;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="footer">
            CorpNet v2.4.1 &copy; 2025 Internal Security<br>
            Server: 10.0.0.5 • DB: corpdb • Last updated: 2025-10-31
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('function', function(e){});
        // Simple client-side validation (not for security)
        document.getElementById('loginForm').addEventListener('submit', function(e){
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();
            if(u === '' || p === ''){
                alert('Please fill in all fields');
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
