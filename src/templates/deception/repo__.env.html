<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acme Corp - Internal Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:320px}
.login-box h2{margin-top:0;text-align:center;color:#2c3e50;font-size:1.8rem}
.login-box label{display:block;margin-top:1rem;font-weight:bold;color:#34495e}
.login-box input[type=text],
.login-box input[type=password]{width:100%;padding:.5rem;margin-top:.3rem;border:1px solid #bdc3c7;border-radius:4px;box-sizing:border-box;font-size:1rem}
.login-box button{width:100%;padding:.75rem;margin-top:1.5rem;background:#2980b9;border:none;border-radius:4px;color:#fff;font-size:1rem;cursor:pointer}
.login-box button:hover{background:#1f618d}
#msg{margin-top:1rem;text-align:center;color:#c0392b;font-size:.9rem}
</style>
</head>
<body>
<div class="login-box">
<h2>Acme Corp Internal Portal</h2>
<form id="loginForm">
<label for="username">Username:</label>
<input type="text" id="username" name="username" required>
<label for="password">Password:</label>
<input type="password" id="password" name="password" required>
<button type="submit">Sign In</button>
</form>
<div id="msg"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
e.preventExpired?e.preventDefault():e.preventDefault();
var u=document.getElementById('username').value;
var p=document.getElementById('password').value;
if(u==='admin' && p==='Acme2024!'){
window.location.href='/dashboard';
}else{
document.getElementById('msg').textContent='Invalid credentials. Please try again.';
}
});
</script>
</body>
</html>
