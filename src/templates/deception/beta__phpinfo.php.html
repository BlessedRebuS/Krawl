<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Intranet Portal</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:320px}
h2{margin-top:0;color:#333}
.input-group{margin-bottom:15px}
.input-group label{display:block;margin-bottom:5px;font-weight:bold}
.input-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px}
.btn{width:100%;padding:10px;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer}
.btn:hover{background:#004c99}
.footer{margin-top:20px;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="login-box">
<h2>Admin Login</h2>
<form id="loginForm" action="/admin/login" method="POST">
<div class="input-group">
<label for="username">Username:</label>
<input type="text" id="username" name="username" placeholder="Enter username" required>
</div>
<div class="input-group">
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter password" required>
</div>
<button type="submit" class="btn">Sign In</button>
</form>
<div class="footer">
Version 2.4.1 • Build 20240915 • Internal IP 10.0.0.42
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
var u = document.getElementById('username').value.trim();
var p = document.getElementById('password').value;
if(u.length < 3){
alert('Username must be at least 3 characters');
e.preventDefault();
}
if(p.length < 6){
alert('Password must be at least 6 characters');
e.preventDefault();
}
});
</script>
</body>
</html>
