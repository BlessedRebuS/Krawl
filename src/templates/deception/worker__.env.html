<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acme Corp - Internal Portal</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f4f4f4;}
.container{max-width:800px;margin:40px auto;background:#fff;padding:20px;box-shadow:0 0 10px rgba(0,0,0,.1);}
h1{color:#2c3e50;}
.form-group{margin-bottom:15px;}
label{display:block;margin-bottom:5px;font-weight:bold;}
input[type=text],input[type=password]{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;}
button{background:#3498db;color:#fff;border:none;padding:10px 15px;border-radius:4px;cursor:pointer;}
button:hover{background:#2980b9;}
.footer{margin-top:30px;font-size:0.9em;color:#7f8c8d;text-align:center;}
</style>
</head>
<body>
<div class="container">
<h1>Acme Corp Internal Portal</h1>
<p>Welcome to the Acme Corp internal network. Please log in to continue.</p>
<form action="/login.php" method="post">
<div class="form-group">
<label for="username">Username:</label>
<input type="text" id="username" name="username" placeholder="Enter your username" required>
</div>
<div class="form-group">
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
</div>
<button type="submit">Sign In</button>
</form>
<p>Version: 2.4.1 (build 20240915) | Server: 10.0.0.42</p>
<div class="footer">
&copy; 2024 Acme Corp. All rights reserved.
</div>
</div>
</body>
</html>
