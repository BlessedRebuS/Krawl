<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - CorpPortal</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:0;display:flex;height:100vh;justify-content:center;align-items:center;}
.login-box{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:320px;}
.login-box h2{margin-top:0;color:#333;text-align:center;}
.input-group{margin-bottom:15px;}
.input-group label{display:block;margin-bottom:5px;font-weight:bold;}
.input-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;}
.btn{width:100%;padding:10px;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:16px;}
.btn:hover{background:#004c99;}
.footer{margin-top:20px;font-size:12px;text-align:center;color:#666;}
</style>
</head>
<body>
<div class="login-box">
<h2>Admin Portal</h2>
<form id="loginForm">
<div class="input-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter username" required>
</div>
<div class="input-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter password" required>
</div>
<button type="submit" class="btn">Sign In</button>
</form>
<div class="footer">
Powered by AdminPanel v2.3.4 &copy; 2024 CorpInternal<br>
Server: 10.0.0.5 | DB: corpdb_prod
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){e.preventDefault();var u=document.getElementById('username').value;var p=document.getElementById('password').value;if(u && p){alert('Login attempt recorded for '+u);}});
</script>
</body>
</html>
