<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Corp - Admin Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="generator" content="Apache 2.4.41 (Ubuntu)">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #004c99;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Console Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="Enter username">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
            <button type="submit">Sign In</button>
        </form>
        <div class="footer">
            Acme Corp &copy; 2024<br>
            Internal IP: 10.0.0.5<br>
            Version: v2.3.1 (build 20240915)
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = this.username.value.trim();
            const password = this.password.value;
            if (username === '' || password === '') {
                alert('Please fill in both fields.');
                return;
            }
            // Simulate authentication attempt
            // In a real scenario, this would send credentials to the server
            alert('Login attempt submitted for user: ' + username);
            // For demo, clear form
            this.reset();
        });
    </script>
</body>
</html>
