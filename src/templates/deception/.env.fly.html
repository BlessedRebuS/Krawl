<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Corp – Internal Portal</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; margin:0; padding:0; background:#f4f6f9; color:#333;}
        header {background:#003366; color:#fff; padding:1rem; text-align:center;}
        header h1 {margin:0; font-size:1.8rem;}
        .container {max-width:960px; margin:2rem auto; padding:0 1rem;}
        .card {background:#fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1); padding:2rem;}
        .form-group {margin-bottom:1.5rem;}
        label {display:block; margin-bottom:.5rem; font-weight:bold;}
        input[type="text"], input[type="password"], input[type="email"] {width:100%; padding:.75rem; border:1px solid #ccc; border-radius:4px; font-size:1rem;}
        button {background:#003366; color:#fff; border:none; padding:.75rem 1.5rem; border-radius:4px; cursor:pointer; font-size:1rem;}
        button:hover {background:#002244;}
        footer {text-align:center; padding:1rem; font-size:.85rem; color:#666; margin-top:2rem;}
        .notice {background:#fffbcc; border-left:4px solid #ffdd57; padding:.75rem 1rem; margin-bottom:1.5rem;}
    </style>
</head>
<body>
    <header>
        <h1>Acme Corp – Internal Portal</h1>
        <div style="font-size:.9rem; opacity:.9;">v2.4.1 • Build 20240915</div>
    </header>
    <div class="container">
        <div class="notice">System maintenance scheduled for tonight 02:00–04:00 UTC. Please save your work.</div>
        <div class="card">
            <h2>Employee Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g., jdoe" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <p style="margin-top:1rem; font-size:.9rem; color:#555;">
                Forgot password? Contact IT Helpdesk at <a href="mailto:ithelp@acme.internal" style="color:#003366;">ithelp@acme.internal</a>
            </p>
        </div>
    </div>
    <footer>
        © 2024 Acme Corporation • Internal Use Only • <a href="/status" style="color:#003366;">System Status</a> • <a href="/privacy" style="color:#003366;">Privacy</a>
    </footer>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e){
            e.preventDefault();
            const user = this.username.value.trim();
            const pass = this.password.value;
            if(!user || !pass){
                alert('Please enter both username and password.');
                return;
            }
            // Simulate login attempt
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username:user, password:pass})
            })
            .then(r => r.json())
            .then(data => {
                if(data.success){
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || 'Login failed. Check credentials.');
                }
            })
            .catch(() => {
                alert('Network error. Please try again later.');
            });
        });
    </script>
</body>
</html>
