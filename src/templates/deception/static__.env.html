<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intranet Portal - Secure Access</title>
    <style>
        body {font-family: Arial, sans-serif; background:#f4f6f9; margin:0; display:flex; height:100vh;}
        .container {width:360px; margin:auto; padding:30px; background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.1);}
        h2 {color:#2c3e50; text-align:center;}
        .form-group {margin-bottom:20px;}
        label {display:block; margin-bottom:5px; font-weight:600; color:#34495e;}
        input[type="text"], input[type="password"] {width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;}
        button {width:100%; padding:12px; background:#2980b9; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px;}
        button:hover {background:#3498db;}
        .footer {margin-top:20px; font-size:12px; color:#7f8c8d; text-align:center;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Intranet Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <div class="footer">
            Version 2.4.1 &copy; 2025 CorpSecure Inc. | Internal IP: 10.0.0.45
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e){
            e.preventDefault();
            const username = this.username.value.trim();
            const password = this.password.value;
            if(!username || !password){
                alert('Please fill in all fields');
                return;
            }
            // Simulate AJAX login
            fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(r => r.json())
            .then(data => {
                if(data.success){
                    window.location.href = '/dashboard';
                } else {
                    alert('Invalid credentials: ' + (data.message || ''));
                }
            })
            .catch(() => alert('Network error'));
        });
    </script>
</body>
</html>
