<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acme Corp - Admin Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:0;display:flex;height:100vh;justify-content:center;align-items:center}
.login-box{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:320px}
h2{margin-top:0;color:#333;text-align:center}
.input-group{margin-bottom:15px}
.input-group label{display:block;margin-bottom:5px;font-weight:bold}
.input-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.btn{width:100%;padding:10px;background:#0066cc;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
.btn:hover{background:#004c99}
.footer{margin-top:20px;font-size:12px;color:#777;text-align:center}
</style>
</head>
<body>
<div class="login-box">
<h2>Acme Corp Admin Portal</h2>
<form id="loginForm">
<div class="input-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter username" required>
</div>
<div class="input-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter password" required>
</div>
<button type="submit" class="btn">Sign In</button>
</form>
<div class="footer">
Version: Apache/2.4.41 (Ubuntu) PHP/7.4.3 MySQL/5.7.33<br>
Internal IP: 10.0.0.5
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); alert('Login processing...'); });
</script>
</body>
</html>
