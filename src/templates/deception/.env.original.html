<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - Acme Corp Intranet</title>
<style>
    body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;display:flex;height:100vh;align-items:center;justify-content:center}
    .login-box{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);width:320px}
    h2{margin-top:0;color:#333;text-align:center}
    .input-group{margin-bottom:1.5rem}
    label{display:block;margin-bottom:.5rem;font-weight:600;color:#555}
    input[type="text"],input[type="password"]{width:100%;padding:.75rem;border:1px solid #ccc;border-radius:4px;font-size:1rem}
    .btn{width:100%;padding:.75rem;background:#0066cc;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer}
    .btn:hover{background:#004c99}
    .footer{margin-top:1.5rem;font-size:.85rem;color:#777;text-align:center}
</style>
</head>
<body>
<div class="login-box">
    <h2>Admin Portal</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="footer">
        Acme Corp Intranet • v2.4.1 • Server: 10.0.5.23 • DB: prod_db
    </div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit',function(e){
        e.preventDefault();
        const u=document.getElementById('username').value;
        const p=document.getElementById('password').value;
        if(u==='admin' && p==='Admin2025!'){
            window.location.href='/admin/dashboard';
        }else{
            alert('Invalid credentials. Please try again.');
        }
    });
</script>
</body>
</html>
