<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>phpMyAdmin</title>
<style>
body{font-family:Arial,sans-serif;background:#f8f9fa;margin:0;padding:0;color:#212529}
.container{max-width:400px;margin:60px auto;background:#fff;padding:30px;border-radius:5px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h2{text-align:center;margin-bottom:20px;color:#003580}
.input-group{margin-bottom:15px}
.input-group label{display:block;margin-bottom:5px;font-weight:600}
.input-group input{width:100%;padding:8px;border:1px solid #ced4da;border-radius:4px;font-size:1rem}
.btn{width:100%;padding:10px;background:#003580;border:none;color:#fff;font-size:1rem;border-radius:4px;cursor:pointer}
.btn:hover{background:#002855}
.footer{margin-top:20px;font-size:.85rem;text-align:center;color:#6c757d}
</style>
</head>
<body>
<div class="container">
<h2>phpMyAdmin</h2>
<form action="index.php" method="post">
<div class="input-group">
<label for="input_username">Username</label>
<input type="text" id="input_username" name="pma_username" value="" autocomplete="username">
</div>
<div class="input-group">
<label for="input_password">Password</label>
<input type="password" id="input_password" name="pma_password" value="" autocomplete="current-password">
</div>
<button type="submit" class="btn">Go</button>
</form>
<div class="footer">
phpMyAdmin 4.9.5deb2 &copy; 2005-2020 The phpMyAdmin developers<br>
Server: localhost (MySQL 5.7.33-0ubuntu0.18.04.1)<br>
PHP Version: 7.4.3-4ubuntu2.13
</div>
</div>
</body>
</html>
