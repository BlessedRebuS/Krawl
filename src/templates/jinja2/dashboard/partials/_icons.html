{# Stroke icons for the shell (sidebar, top bar, palette). 24px grid drawn
   at 16-18px; they inherit color from the control. #}
{% macro icon(name, cls='nav-icon') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'overview' -%}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'attacks' -%}<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
{%- elif name == 'threats' -%}<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>
{%- elif name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
{%- elif name == 'advanced-search' -%}<path d="M3 5h18M6 12h12M10 19h4"/>
{%- elif name == 'ip-insight' -%}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M22 12h-2M4 12H2M12 4V2M12 22v-2"/>
{%- elif name == 'tracked-ips' -%}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'banlist' -%}<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>
{%- elif name == 'timedout' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'deception' -%}<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
{%- elif name == 'webhooks' -%}<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>
{%- elif name == 'docs' -%}<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>
{%- elif name == 'export' -%}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
{%- elif name == 'settings' -%}<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
{%- elif name == 'lock' -%}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'logout' -%}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'menu' -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'collapse' -%}<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
{%- elif name == 'close' -%}<path d="M18 6 6 18M6 6l12 12"/>
{%- endif -%}
</svg>
{%- endmacro %}
