{# Recent Suspicious Activity - server-rendered on page load #}
<div class="table-container">
    <div class="row-top">
        <h2>Recent Suspicious Activity</h2>
        <div class="row gap-2">
            <button type="button" id="suspicious-live-toggle" class="dashboard-live-toggle"
                    role="switch" aria-checked="false" aria-label="Toggle live suspicious activity"
                    onclick="toggleMapLiveMode()">
                <span class="map-live-toggle-light" aria-hidden="true"></span>
                <span>Live</span>
            </button>
            <button class="expand-btn" onclick="openExpandOverlay('Recent Suspicious Activity', 'suspicious', 25)" title="Expand">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5H4.56l2.72 2.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L3.5 4.56v2.69a.75.75 0 0 1-1.5 0v-3.5A1.75 1.75 0 0 1 3.75 2Zm8.5 12h-3.5a.75.75 0 0 1 0-1.5h2.69l-2.72-2.72a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.72 2.72v-2.69a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14Z"/></svg>
            </button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>IP Address</th>
                <th>Method</th>
                <th>Path</th>
                <th>User-Agent</th>
                <th>Time</th>
                <th class="col-w-80"></th>
            </tr>
        </thead>
        <tbody id="recent-suspicious-body">
            {% include "dashboard/partials/suspicious_rows.html" %}
        </tbody>
    </table>
</div>
