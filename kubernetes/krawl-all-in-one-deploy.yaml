# Source: krawl-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krawl
  namespace: krawl-system
  labels:
    app.kubernetes.io/name: krawl
    app.kubernetes.io/instance: krawl
    app.kubernetes.io/version: "2.4.0"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: krawl
      app.kubernetes.io/instance: krawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krawl
        app.kubernetes.io/instance: krawl
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: krawl
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        image: "ghcr.io/blessedrebus/krawl:2.5.0"
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: CONFIG_LOCATION
          value: "config.yaml"
        - name: KRAWL_PORT
          value: "5000"
        - name: KRAWL_UVICORN_LIMIT_CONCURRENCY
          value: "512"
        - name: KRAWL_UVICORN_BACKLOG
          value: "256"
        - name: KRAWL_UVICORN_KEEP_ALIVE
          value: "5"
        - name: KRAWL_UVICORN_GRACEFUL_TIMEOUT
          value: "30"
        # Optional: pull dashboard password from an externally-managed Secret
        # (e.g. via ExternalSecrets / SealedSecrets / Vault). Uncomment and
        # create the Secret under key `dashboard-password` to enable.
        # - name: KRAWL_DASHBOARD_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: krawl-dashboard
        #       key: dashboard-password
        # Optional: pull the dashboard secret path from an externally-managed
        # Secret. When set, this overrides config.dashboard.secret_path at
        # runtime, so the path no longer has to live in plaintext config.
        # - name: KRAWL_DASHBOARD_SECRET_PATH
        #   valueFrom:
        #     secretKeyRef:
        #       name: krawl-dashboard
        #       key: dashboard-path
        # Optional: pull Redis password from an externally-managed Secret. The
        # bundled Redis ships with no password; uncomment to require one.
        # - name: KRAWL_REDIS_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: krawl-redis
        #       key: redis-password
        - name: KRAWL_MODE
          value: "scalable"
        - name: KRAWL_POSTGRES_HOST
          value: "postgres"
        - name: KRAWL_POSTGRES_PORT
          value: "5432"
        - name: KRAWL_POSTGRES_USER
          value: "krawl"
        - name: KRAWL_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: krawl-postgres
              key: postgres-password
        - name: KRAWL_POSTGRES_DATABASE
          value: "krawl"
        - name: KRAWL_REDIS_HOST
          value: "redis"
        - name: KRAWL_REDIS_PORT
          value: "6379"
        - name: KRAWL_REDIS_DB
          value: "0"
        - name: KRAWL_REDIS_CACHE_TTL
          value: "600"
        - name: KRAWL_REDIS_HOT_TTL
          value: "30"
        - name: KRAWL_REDIS_TABLE_TTL
          value: "120"
        - name: KRAWL_CUSTOM_TEMPLATE_PATH
          value: "/etc/krawl/templates/custom_page.html"
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: custom-template
          mountPath: /etc/krawl/templates
          readOnly: true
        resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        # TCP startup probe: verifies the server is accepting connections
        # without hitting the honeypot catch-all, so probes are never counted
        # toward bans or served a 429. For an HTTP health check under the secret
        # dashboard prefix, use the Helm chart with config.dashboard.secret_path set.
        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: krawl-config
      - name: custom-template
        configMap:
          name: krawl-custom-template
---
# Source: krawl-chart/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: krawl-postgres
  namespace: krawl-system
  labels:
    app.kubernetes.io/name: krawl
    app.kubernetes.io/instance: krawl
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krawl-postgres
      app.kubernetes.io/instance: krawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krawl-postgres
        app.kubernetes.io/instance: krawl
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: "postgres:16-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "krawl"
        - name: POSTGRES_USER
          value: "krawl"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: krawl-postgres
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
        resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - "krawl"
              - -d
              - "krawl"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - "krawl"
              - -d
              - "krawl"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: krawl-postgres
      # parallel queries need more than the 64Mi default /dev/shm
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
# Source: krawl-chart/templates/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: krawl-redis
  namespace: krawl-system
  labels:
    app.kubernetes.io/name: krawl
    app.kubernetes.io/instance: krawl
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krawl-redis
      app.kubernetes.io/instance: krawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krawl-redis
        app.kubernetes.io/instance: krawl
    spec:
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: "redis:7-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        command:
          - redis-server
          - --maxmemory
          - "192mb"
          - --maxmemory-policy
          - volatile-lru
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
            limits:
              cpu: 250m
              # Leave headroom above Redis maxmemory for allocator overhead,
              # client buffers, replication/AOF buffers and fragmentation.
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: krawl-redis
