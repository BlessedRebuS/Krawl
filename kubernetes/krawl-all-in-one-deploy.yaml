# Source: krawl-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: krawl
  namespace: krawl-system
  labels:
    app.kubernetes.io/name: krawl
    app.kubernetes.io/instance: krawl
    app.kubernetes.io/version: "2.4.0"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # Sessions and caches are shared through Redis, so client stickiness would
  # only make load distribution less even across replicas.
  sessionAffinity: None
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: krawl
    app.kubernetes.io/instance: krawl
