# Krawl Honeypot Configuration

# Deployment mode: "standalone" (SQLite + in-memory cache) or "scalable" (PostgreSQL + Redis)
mode: standalone

# PostgreSQL settings (only used in scalable mode)
postgres:
  host: "localhost"
  port: 5432
  user: "krawl"
  password: "krawl"
  database: "krawl"

# Redis settings (only used in scalable mode)
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  # Cache TTL settings (seconds) — tune for your traffic volume
  cache_ttl: 600    # Dashboard warmup data (default: 10 minutes)
  hot_ttl: 30       # Hot-path data like ban info, IP categories (default: 30 seconds)
  table_ttl: 120    # Paginated dashboard tables (default: 2 minutes)

server:
  port: 5000
  delay: 100  # Response delay in milliseconds

  # manually set the server header, if null a random one will be used.
  server_header: null

links:
  min_length: 5
  max_length: 15
  min_per_page: 5
  max_per_page: 10
  char_space: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  max_counter: 10

canary:
  token_url: null  # Optional canary token URL
  token_tries: 10

dashboard:
  # Random path generated when null. If set, must start with a forward slash.
  secret_path: null

  # Protects the dashboard panels. Random and logged when null.
  # Also KRAWL_DASHBOARD_PASSWORD.
  password: null

  # Pre-computes dashboard data every 5 minutes instead of querying per request.
  # Redundant in scalable mode, where table caching already covers it.
  cache_warmup: true

  # Pages pre-warmed per table panel. Scalable mode only.
  warmup_pages: 10

  # Pre-computes full top_paths/top_ua aggregations so any page costs no queries.
  warmup_aggregation: false

  # Hides top paths / user agents below this many accesses. 1 disables filtering.
  top_n_min_count: 5

  # Top-left wordmark on the dashboard. Defaults are Krawl's own.
  branding:
    name: "Krawl"
    # Where the wordmark links. null renders it as plain text instead.
    url: "https://github.com/BlessedRebuS/Krawl"
    # Image URL shown instead of the GitHub mark (http(s) or a dashboard path).
    logo: null
    show_version: true
    # An address, a link, or neither — plain text is left unlinked.
    contact: null

backups:
  path: "backups"
  cron: "*/30 * * * *"
  enabled: false

# Prometheus metrics endpoint, exposed at /{dashboard_secret_path}/metrics.
# When disabled, the endpoint returns 404 and refresh helpers no-op.
metrics:
  enabled: true

logging:
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

database:
  path: "data/krawl.db"
  retention_days: 30
  # Log only suspicious requests. IP stats counters still count every request.
  persist_suspicious_only: false

# Rotating IPv6 proxy pools burn a fresh address per request, so per-address
# tracking is worthless and grows rows and memory without bound.
ipv6:
  # Drop IPv6: still logged to stdout, never persisted, ban-checked or exported.
  ignore: false
  # Also delete existing IPv6 rows at next startup. Irreversible; needs `ignore`.
  purge_existing: false

behavior:
  probability_error_codes: 0  # 0-100 percentage

analyzer:
  http_risky_methods_threshold: 0.1
  violated_robots_threshold: 0.1
  uneven_request_timing_threshold: 0.5
  uneven_request_timing_time_window_seconds: 300
  user_agents_used_threshold: 2
  attack_urls_threshold: 1
  # Compute TLSH fuzzy hashes for captured payloads/files (near-duplicate clustering).
  tlsh_enabled: true
  # TLSH distance below which a payload joins an existing campaign.
  tlsh_cluster_threshold: 150
  # A campaign shows only when its payload was seen more than this many times.
  tlsh_campaign_min_events: 10
  # Capture the inbound HTTP Referer header on access logs for bait-chain tracking.
  referer_enabled: true

crawl:
  infinite_pages_for_malicious: true
  max_pages_limit: 250
  ban_duration_seconds: 600

# Never tracked, banned or exported, and purged at startup. Single IPs or CIDRs.
# Add your own trusted networks: monitoring, health checks, office egress.
ignored_ips:
  - 127.0.0.0/8      # loopback
  - 10.0.0.0/8       # RFC1918 private
  - 172.16.0.0/12    # RFC1918 private
  - 192.168.0.0/16   # RFC1918 private
  - 169.254.0.0/16   # link-local
  - 0.0.0.0/8        # "this network"
  - 100.64.0.0/10    # CGNAT
  - ::1/128          # IPv6 loopback
  - fc00::/7         # IPv6 unique local
  - fe80::/10        # IPv6 link-local

# Basemap for the IP origins map. {z}/{x}/{y} required; {s} and {r} optional.
map:
  # Esri dark canvas: keyless, no watermark.
  tile_url: "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  attribution: "&copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors"

  # CARTO dark: watermarks every tile unless api_key is set. Raster endpoint
  # only -- CARTO's docs push vector style.json, which Leaflet cannot render.
  # tile_url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
  # attribution: "&copy; CARTO | &copy; OpenStreetMap contributors"

  # OpenStreetMap: keyless but light-themed, needs the CSS invert in the docs.
  # tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  # attribution: "&copy; OpenStreetMap contributors"

  subdomains: "abcd"
  # Sent as ?key= on every tile request, and visible in the page source.
  # Restrict it to your dashboard domain at the provider. Also KRAWL_MAP_API_KEY.
  api_key: ""
  # Query parameter the key rides on: CARTO and Stadia want api_key,
  # Thunderforest apikey, MapTiler key. Also KRAWL_MAP_API_KEY_PARAM.
  api_key_param: "api_key"

tarpit:
  enabled: false  # Opt-in: trap AI agents with slow responses and random text
  delay_seconds: 5  # Extra delay (seconds) added to each response when tarpit is active

# Custom honeypot page. Optional {counter} and {content} placeholders.
# custom_template_path: "/path/to/custom_page.html"

# AI-generated deception pages via OpenRouter or OpenAI. For a self-hosted LLM,
# set provider to "openai" and point openai_base_url at its endpoint.
ai:
  enabled: false
  provider: "openrouter"  # "openrouter" or "openai"
  # openai_base_url: "https://api.openai.com/v1" # this is only needed if provider is set to "openai" and you want to use a custom endpoint to reach different models
  # openai_base_url: "http://krawl-llm:8080/v1"
  api_key: "" # set your OpenAI or OpenRouter API key here
  model: "" # for example nvidia/nemotron-3-super-120b-a12b:free or gpt-5.1-mini
  timeout: 300  # Request timeout in seconds for API calls
  max_daily_requests: 100  # Limit the number of AI-generated responses per day
  reasoning: 
    enabled: false # Enable advanced reasoning for AI-generated responses (works only for OpenRouter's models with reasoning)
    effort: "medium"  # "none", "minimal", "low", "medium", "high", "xhigh" (doc: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens)
  # Only {path} and {query_part} are substituted — any other brace raises a
  # KeyError and kills generation, so avoid literal braces in this prompt.
  prompt: |
    You are a real web server. Return the contents of this path, and nothing else:
    {path}{query_part}

    No markdown, no code fences, no explanation, and never hint that the content
    is generated, fake, or a honeypot.

    Decide who runs this server and commit to it — a haulage firm, a dental
    practice, a university lab, a council office, an ageing internal intranet.
    Give it a specific, ordinary name. Never Acme, Example, Contoso, Foo, Widget
    or "Your Company"; never lorem ipsum; never a generic "solutions for
    business" landing page.

    If the path ends in a file extension, return that file's raw contents — JSON
    for .json and .map, the file itself for .env, .sql, .php, .log — with no
    HTML around it. Otherwise return one self-contained HTML page, CSS and JS
    inline, no external assets.

    Make it look deployed, not designed: plain, dated, slightly inconsistent
    markup reads as real, a centred hero on a blue header reads as fake. Vary
    the layout between paths.

    Include concrete detail — staff names, hostnames, version numbers, internal
    IPs, ticket numbers, dates. If the path implies a login, admin panel, config
    or export, produce that artefact itself, not a page describing it.

banlist:
  export_path:  # Public banlist download path, e.g. "/public_banlist.txt". Unauthenticated, and supports the same ?categories= and ?fwtype= parameters as the main banlist API. Empty = disabled.
#  sources:
#    - "https://demo.krawlme.com/das_dashboard/api/export-ips?categories=attacker&fwtype=raw" # Upstream banlist URLs to fetch, e.g. ["https://krawl.example.com/public_banlist.txt"]. You can add an array of URLs here. Even external "".txt" banlists are supported.
  refresh_interval: 3600  # Seconds between fetches

deception:
  # Imports src/templates/deception at startup; "/" in a filename becomes a path
  # separator (test_blabla.html -> /test/blabla). Zips upload via the dashboard.
  import_pages: true
