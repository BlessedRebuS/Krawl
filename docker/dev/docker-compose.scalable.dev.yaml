---
# THIS IS FOR DEVELOPMENT PURPOSES — scalable mode (PostgreSQL + Redis)
# Same topology as docker/docker-compose.scalable.yaml, but Krawl is built from
# the local source tree instead of the published image.
#
# Usage: docker compose -f docker/dev/docker-compose.scalable.dev.yaml up --build
#
# Container names and volumes are suffixed with -dev so this stack can coexist
# with the standalone dev stack and with docker/docker-compose.scalable.yaml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: krawl-postgres-dev
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: krawl
      POSTGRES_USER: krawl
      POSTGRES_PASSWORD: krawl
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krawl -d krawl"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krawl-redis-dev
    ports:
      - 6379:6379
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  krawl:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: krawl-server-scalable
    ports:
      - "5000:5000"
    environment:
      - CONFIG_LOCATION=config.yaml
      - KRAWL_MODE=scalable
      - KRAWL_POSTGRES_HOST=postgres
      - KRAWL_POSTGRES_PORT=5432
      - KRAWL_POSTGRES_USER=krawl
      - KRAWL_POSTGRES_PASSWORD=krawl
      - KRAWL_POSTGRES_DATABASE=krawl
      - KRAWL_REDIS_HOST=redis
      - KRAWL_REDIS_PORT=6379
      - KRAWL_DASHBOARD_WARMUP_AGGREGATION=true
      # Uncomment to pin the dashboard path and password across restarts
      # - KRAWL_DASHBOARD_SECRET_PATH=/dev-dashboard
      # - KRAWL_DASHBOARD_PASSWORD=your-secret-password
      # Set this to change timezone
      # - TZ=Europe/Rome
    volumes:
      - ../../wordlists.json:/app/wordlists.json:ro
      - ../../config.yaml:/app/config.yaml:ro
      - ../../logs:/app/logs
      - ../../backups:/app/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - path: ../../Dockerfile
          action: rebuild
        - path: ../../src/
          action: rebuild
        - path: ./docker-compose.scalable.dev.yaml
          action: rebuild

volumes:
  postgres_data_dev:
  redis_data_dev:
