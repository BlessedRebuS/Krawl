---
# THIS IS FOR DEVELOPMENT PURPOSES — standalone mode (SQLite + in-memory cache)
# Usage: docker compose -f docker/dev/docker-compose.standalone.dev.yaml up --build
#
# Set KRAWL_DASHBOARD_SECRET_PATH/KRAWL_DASHBOARD_PASSWORD below if you don't want
# a fresh dashboard path and password generated on every restart.
services:
  krawl:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: krawl-server-standalone
    ports:
      - "5000:5000"
    environment:
      - CONFIG_LOCATION=config.yaml
      # Uncomment to pin the dashboard path and password across restarts
      # - KRAWL_DASHBOARD_SECRET_PATH=/dev-dashboard
      # - KRAWL_DASHBOARD_PASSWORD=your-secret-password
      # set this to change timezone, alternatively mount /etc/timezone or /etc/localtime based on the time system management of the host environment
      # - TZ=${TZ}
    volumes:
      - ../../wordlists.json:/app/wordlists.json:ro
      - ../../config.yaml:/app/config.yaml:ro
      - ../../logs:/app/logs
      - ../../data:/app/data
      - ../../backups:/app/backups
    restart: unless-stopped
    develop:
      watch:
        - path: ../../Dockerfile
          action: rebuild
        - path: ../../src/
          action: rebuild
        - path: ./docker-compose.dev.yaml
          action: rebuild
