# Deployment mode: "standalone" (SQLite + in-memory cache) or "scalable" (PostgreSQL + Redis)
mode: scalable

replicaCount: 1

image:
  repository: ghcr.io/blessedrebus/krawl
  pullPolicy: Always
  # Empty uses Chart.yaml appVersion. Override only to pin another image tag.
  tag: ""

imagePullSecrets: []
nameOverride: "krawl"
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

# Include the Helm release revision in the pod template. This makes every
# `helm upgrade` restart the application pods, which is required when an image
# tag is deliberately reused (imagePullPolicy only applies when a pod starts).
rolloutOnUpgrade: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Uvicorn and pod lifecycle bounds. Keep one worker per pod; scale replicaCount
# in scalable mode instead of creating multiple schedulers inside one pod.
runtime:
  limitConcurrency: 512
  backlog: 256
  keepAliveSeconds: 5
  gracefulShutdownSeconds: 30
  # Optional worker recycling; 0 disables it. Useful only when profiling shows
  # long-term native allocation growth because recycling loses warm caches.
  limitMaxRequests: 0
  terminationGracePeriodSeconds: 45
  preStopDelaySeconds: 5

probes:
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

service:
  type: ClusterIP
  port: 5000
  annotations: {}
  # Scalable mode stores sessions/cache in Redis, so stickiness only creates
  # uneven hot pods. Standalone has one replica and does not need it either.
  sessionAffinity: None
  sessionAffinityTimeoutSeconds: 10800
  # Preserve source IP when using LoadBalancer
  externalTrafficPolicy: Local

# Prometheus Operator ServiceMonitor for scraping the /metrics endpoint.
# Requires the ServiceMonitor CRD (monitoring.coreos.com/v1) in the cluster.
# The resource is only rendered when ALL of the following are true:
#   - serviceMonitor.enabled is true
#   - config.metrics.enabled is true
#   - config.dashboard.secret_path is set (the metrics path is
#     /<secret_path>/metrics, so an auto-generated/blank path can't be scraped)
# Grafana dashboard shipped as a ConfigMap for the Grafana sidecar to pick up.
# The dashboard JSON is the one at the repository root; the sidecar discovers the
# ConfigMap by label, so set `label`/`labelValue` to whatever your Grafana watches
# (grafana_dashboard: "1" for the kube-prometheus-stack / Rancher sidecar).
grafanaDashboard:
  enabled: false
  label: grafana_dashboard
  labelValue: "1"
  # Namespace the sidecar watches, when it is not the release namespace
  # (e.g. cattle-monitoring-system on Rancher). Empty = release namespace.
  namespace: ""
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels so your Prometheus's serviceMonitorSelector matches this
  # resource (e.g. release: kube-prometheus-stack).
  labels: {}
  honorLabels: false
  relabelings: []
  metricRelabelings: []

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: krawl.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: krawl-tls
  #    hosts:
  #      - krawl.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Container timezone configuration
# Set this to change timezone (e.g., "America/New_York", "Europe/Rome")
# If not set, container will use its default timezone
timezone: ""

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Dashboard password for protected panels
# If empty, a random password will be auto-generated and printed in the logs
dashboardPassword: ""
# Read the dashboard password and/or secret path from an externally-managed
# Secret (ExternalSecrets / SealedSecrets / Vault) instead of the chart-managed
# one. `name` empty = use the chart-managed Secret built from `dashboardPassword`.
# `pathKey` empty = the secret path comes from config.dashboard.secret_path;
# when set, KRAWL_DASHBOARD_SECRET_PATH is injected from the Secret instead.
dashboardExistingSecret:
  name: ""
  passwordKey: "dashboard-password"
  pathKey: ""

# AI/LLM API key from an externally-managed Secret instead of the chart-managed
# one built from `config.ai.api_key`. `name` empty = chart-managed.
aiExistingSecret:
  name: ""
  key: "ai-api-key"

# Map tile API key from an externally-managed Secret instead of the
# chart-managed one built from `config.map.api_key`. `name` empty =
# chart-managed. Injected as KRAWL_MAP_API_KEY.
mapExistingSecret:
  name: ""
  key: "map-api-key"

# Canary token URL. Setting `canaryTokenUrl` creates a chart-managed Secret and
# injects KRAWL_CANARY_TOKEN_URL from it, keeping the URL out of the ConfigMap.
# Set `canaryExistingSecret.name` to read it from an external Secret instead.
canaryTokenUrl: ""
canaryExistingSecret:
  name: ""
  key: "canary-token-url"

# CloudFlare WAF/banlist sync credentials. Set them inline (chart-managed
# Secret) or point `existingSecret.name` at an externally-managed one. Either
# way they are injected as KRAWL_CLOUDFLARE_ACCOUNT_ID / KRAWL_CLOUDFLARE_AUTH_TOKEN
# and take precedence over data/webhooks.json, so the sync survives restarts
# without a persistent volume and the token is never written back to disk.
cloudflare:
  enabled: false
  accountId: ""
  authToken: ""
  existingSecret:
    name: ""
    accountIdKey: "cloudflare-account-id"
    authTokenKey: "cloudflare-auth-token"

# Extra environment variables for the Krawl container, e.g. any KRAWL_* setting
# this chart does not model yet. `extraEnvFrom` accepts secretRef/configMapRef
# entries, which is the escape hatch for External Secrets Operator / Vault.
extraEnv: []
#  - name: KRAWL_LOG_LEVEL
#    value: "INFO"
extraEnvFrom: []
#  - secretRef:
#      name: krawl-external-secrets

# Application configuration (config.yaml structure)
config:
  server:
    port: 5000
    delay: 100
    server_headers: ["Apache/2.4.41 (Ubuntu)", "nginx/1.18.0", "Microsoft-IIS/10.0", "cloudflare", "AmazonS3", "gunicorn/20.1.0"]  # Server header picked at random
    proxy_headers: [CF-Connecting-IP, X-Forwarded-For, X-Real-IP]  # Real client IP headers, in order
  credentials:  # A POST/PUT with any of these form fields is logged as a credential attempt
    username_fields: [username, user, login, email, log, userid, account]
    password_fields: [password, pass, passwd, pwd, passphrase]
  links:
    min_length: 5
    max_length: 15
    min_per_page: 10
    max_per_page: 15
    char_space: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    max_counter: 10
  canary:
    token_url: null  # Set your canary token URL here
    token_tries: 10
  deception:
    import_pages: true  # Auto-import HTML deception pages from src/templates/deception/ at startup
  dashboard:
    secret_path: null  # Auto-generated if not set, or set to "/my-secret-dashboard"
    cache_warmup: true  # Pre-compute dashboard data every 5 minutes. In scalable mode with Redis, consider setting to false — table caching handles it.
    warmup_pages: 10  # Number of pages to pre-warm per table panel (attacks, attackers, credentials, honeypot)
    warmup_aggregation: true  # Pre-compute full top_paths/top_ua aggregations for instant any-page serving (recommended for scalable)
    top_n_min_count: 5  # Minimum access count to include a path/user-agent in top-N panels (set to 1 to disable)
    domain_map_host_limit: 200  # Maximum hosts shown for the selected root in the domain link map (1-2000)
    # Top-left wordmark on the dashboard. Defaults are Krawl's own.
    branding:
      name: "Krawl"
      url: "https://github.com/BlessedRebuS/Krawl"  # null renders the wordmark as plain text
      logo: null  # Image URL shown instead of the Krawl mark
      show_version: true
      contact: null  # "soc@example.com", a URL, or plain text like "Ext. 4471"
  metrics:
    enabled: true  # Expose Prometheus metrics at /<dashboard.secret_path>/metrics
  backups:
    path: "backups"
    enabled: false
    cron: "*/30 * * * *"
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  database:
    path: "data/krawl.db"
    retention_days: 30  # Deprecated: use config.retention
    persist_suspicious_only: false  # Only persist suspicious requests to access log
  # How long data lives (see docs/retention.md). Unset keys use built-in defaults;
  # database.retention_days still drives non-suspicious / recheck-suspicious when unset.
  retention: {}
    # non-suspicious: 30d
    # recheck-suspicious: 30d
    # re-evaluate-interval: 5d
    # crunch-after: 7d
    # overall: null
  behavior:
    probability_error_codes: 0
    error_codes: [400, 401, 403, 404, 500, 502, 503]  # Trap pages pick one of these
  analyzer:
    http_risky_methods_threshold: 0.1
    violated_robots_threshold: 0.1
    uneven_request_timing_threshold: 0.5
    uneven_request_timing_time_window_seconds: 300
    user_agents_used_threshold: 2
    attack_urls_threshold: 1
    scoring_weights:  # Points per behaviour signal toward each IP category
      attacker:     {risky_http_methods: 6, robots_violations: 4, uneven_request_timing: 3, different_user_agents: 2, attack_url: 15}
      good_crawler: {risky_http_methods: 1, robots_violations: 0, uneven_request_timing: 0, different_user_agents: 0, attack_url: 0}
      bad_crawler:  {risky_http_methods: 2, robots_violations: 6, uneven_request_timing: 0, different_user_agents: 6, attack_url: 4}
      regular_user: {risky_http_methods: 0, robots_violations: 0, uneven_request_timing: 8, different_user_agents: 3, attack_url: 0}
    # Threat-intel capture
    tlsh_enabled: true  # TLSH-hash captured payloads/files (near-duplicate campaign clustering)
    tlsh_cluster_threshold: 150  # TLSH distance below which a payload joins an existing campaign
    tlsh_campaign_min_events: 10  # A campaign shows only when its payload was seen more than this many times
    referer_enabled: true  # Capture the inbound HTTP Referer header (bait-chain tracking)
  detection:
    yara_rules_path: rules
    responses_path: responses  # fake responses for detected attacks (manifest.yaml + files)
  # Rows each scheduled task handles per run; the rest is picked up next run.
  # Raise when a backlog never drains — bigger batches cost pod memory.
  tasks:
    analyze_ips_batch: 2000  # IPs scored per analyze-ips run
    extract_metadata_batch: 500  # Logs parsed per extract-request-metadata run
    extract_files_batch: 500  # Logs scanned per extract-captured-files run
    hash_payloads_batch: 500  # Logs hashed per hash-payloads run
    hash_payloads_chunk: 50  # Raw requests held in memory at once
    hash_files_batch: 50  # Captured files back-filled per run
    cleanup_batch: 1000  # Rows per pre-retention-cleanup pass
    retention_delete_batch: 10000  # Rows per db-retention delete transaction
    crunch_ips_batch: 5000  # Inactive IPs crunched per crunch-access-logs run
  crawl:
    infinite_pages_for_malicious: true
    max_pages_limit: 250
    ban_duration_seconds: 600
  # IPs / CIDR ranges to ignore everywhere: never tracked, banned, exported, or
  # persisted, and purged from the database nightly (03:00). Single IPs or CIDRs
  # (IPv4/IPv6). Defaults cover loopback, RFC1918, link-local and CGNAT ranges;
  # add trusted networks (monitoring, health checks, office egress) as needed.
  ignored_ips:
    - 127.0.0.0/8      # loopback
    - 10.0.0.0/8       # RFC1918 private
    - 172.16.0.0/12    # RFC1918 private
    - 192.168.0.0/16   # RFC1918 private
    - 169.254.0.0/16   # link-local
    - 0.0.0.0/8        # "this network"
    - 100.64.0.0/10    # CGNAT
    - ::1/128          # IPv6 loopback
    - fc00::/7         # IPv6 unique local
    - fe80::/10        # IPv6 link-local
  ai:
    enabled: false
    provider: "openrouter"  # "openrouter" or "openai". Use "openai" for OpenAI-compatible endpoints such as Ollama or llama.cpp.
    openai_base_url: "https://api.openai.com/v1"  # Set to your OpenAI-compatible endpoint, e.g.http://krawl-llm:8080/v1
    api_key: null # set your OpenAI or OpenRouter API key here
    model: null  # for example nvidia/nemotron-3-super-120b-a12b:free or gpt-5.1-mini
    timeout: 300  # Request timeout in seconds for API calls
    max_daily_requests: 100  # Limit the number of AI-generated responses per day
    reasoning:
      enabled: false # only supported for OpenRouter's models with reasoning capabilities
      effort: "medium"  # "none", "minimal", "low", "medium", "high", "xhigh" (doc: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens)
    prompt: |
      You are a real web server. Return the response body for this request, and
      nothing else:
      {path}{query_part}

      No markdown, no code fences, no explanation, and never hint that the content
      is generated, fake, a test, or a honeypot.

      Decide who runs this server and commit to it — a haulage firm, a dental
      practice, a university lab, a council office, an ageing internal intranet.
      Invent a specific, ordinary name for it. Never Acme, Example, Contoso, Foo,
      Widget, CorpNet or "Your Company"; never lorem ipsum; never a generic
      "Internal Portal", "Internal Dashboard" or "solutions for business" page.

      Match the format to the path. A file extension or dotfile gets that file's
      raw contents with no HTML around it: JSON for .json and .map, YAML for .yml,
      KEY=value lines for .env, SQL statements for .sql, log lines for .log,
      JavaScript for .js. A .php path renders as the page it would produce, except
      backup copies (.bak, .old, .save, .swp, a trailing ~) which leak the PHP
      source. Only extensionless and page paths (.html, .asp, .jsp) get HTML: one
      self-contained page, CSS and JS inline, no external assets.

      Make it look deployed, not designed: plain, dated, slightly inconsistent
      markup reads as real, a centred hero on a blue header reads as fake. Vary
      the layout between paths.

      Include concrete detail — staff names, hostnames, version numbers, internal
      IPs, ticket numbers, dates. If the path implies a login, admin panel, config
      or export, produce that artefact itself, not a page describing it. Secrets
      must look live: random keys and tokens of the right length and prefix, never
      AKIAIOSFODNN7EXAMPLE, sk-xxxx, changeme, REDACTED or asterisks.

      If the query string carries an injection payload, answer like a vulnerable
      app would: a database error quoting the broken query, or the input reflected
      back unescaped.
  banlist:
    export_path: ""  # Public banlist download path, e.g. "/public_banlist.txt". Empty = disabled.
    sources: []      # Upstream banlist URLs to fetch, e.g. ["https://krawl1.example.com/public_banlist.txt"]
    refresh_interval: 3600  # Seconds between fetches

  ipv6:
    ignore: false          # Drop IPv6 requests: logged to stdout, never persisted or ban-checked
    purge_existing: false  # Also delete existing IPv6 rows at the next nightly cleanup (irreversible)

  map:
    # Raster {z}/{x}/{y} template only -- not a vector style.json. CARTO
    # watermarks unkeyed tiles; the default below is keyless. See
    # docs/dashboard.md#map-tiles for alternative providers.
    tile_url: "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
    attribution: "&copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors"
    subdomains: "abcd"
    # Query parameter the key rides on. CARTO and Stadia want api_key,
    # Thunderforest apikey, MapTiler key.
    api_key_param: "api_key"
    # Never lands in the ConfigMap: it becomes a chart-managed Secret injected
    # as KRAWL_MAP_API_KEY. Use mapExistingSecret to supply your own instead.
    api_key: ""   # served in the page source; restrict it by domain

  tarpit:
    enabled: false  # Opt-in: trap AI agents with slow responses and random text
    delay_seconds: 5  # Extra delay (seconds) added to each response when tarpit is active

# Custom template settings (optional)
# Helm will mount the custom template at `/etc/krawl/templates/custom_page.html`
customTemplate:
  enabled: false
  # Inline content for the custom template. If empty, create the ConfigMap without data
  # Example HTML below — operators can replace this with their own template.
  content: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Custom Krawl Page</title>
      <style>
        body { font-family: Arial, Helvetica, sans-serif; background:#0b0f14; color:#d0d7de; margin:0; padding:24px }
        .counter { color:#f85149; font-weight:700; margin-bottom:12px }
        .links { display:flex; flex-direction:column; gap:8px }
        .link { background:#111418; padding:10px; border-radius:6px; display:inline-block }
      </style>
    </head>
    <body>
      <h1>Welcome</h1>
      <div class="counter">Refresh cycle: {counter}</div>
      <div class="links">{content}</div>
    </body>
    </html>

# PostgreSQL settings (only used when mode=scalable)
postgres:
  # Deploy PostgreSQL as part of this chart (set to false if using an external instance)
  enabled: true
  host: "postgres"
  port: 5432
  user: "krawl"
  password: "krawl"
  database: "krawl"
  # Read credentials from an externally-managed Secret. `name` empty = use the
  # chart-managed Secret built from `password` above. Any connection key left
  # empty falls back to the plaintext value above.
  # Setting `name` skips the chart-managed postgres Secret; the Krawl
  # Deployment, the bundled StatefulSet and the migration Job all read from it.
  # Combine with `postgres.enabled: false` for a fully external instance.
  existingSecret:
    name: ""
    passwordKey: "postgres-password"
    userKey: ""
    hostKey: ""
    portKey: ""
    databaseKey: ""
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    # storageClassName: ""
  # Server settings, rendered as `-c name=value`. null drops a key.
  # SSD-backed storage: set random_page_cost 1.1, effective_io_concurrency 100.
  config:
    shared_buffers: 256MB
    effective_cache_size: 512MB
    work_mem: 16MB
    maintenance_work_mem: 128MB
    random_page_cost: "4"
    effective_io_concurrency: "1"
  # /dev/shm size (tmpfs). The k8s default of 64Mi is too small for parallel
  # VACUUM. "" leaves it at the default. Counts against the memory limit below.
  shmSize: 256Mi
  # Keep the limit well above shared_buffers + shmSize: the page cache is
  # charged to the cgroup too, and an OOM kill wipes the stats autovacuum needs.
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

# Redis settings (only used when mode=scalable)
redis:
  # Deploy Redis as part of this chart (set to false if using an external instance)
  enabled: true
  host: "redis"
  port: 6379
  db: 0
  password: ""
  # Memory ceiling; "" = unbounded (Redis then grows until OOM-killed).
  # Keep at ~75% of resources.limits.memory to leave room for fragmentation.
  # volatile-lru evicts only TTL'd keys, i.e. krawl:cache:* and never a
  # krawl:counter:* metric. Do not use allkeys-lru.
  maxmemory: "192mb"
  maxmemoryPolicy: "volatile-lru"
  # Cache TTL settings (seconds)
  cache_ttl: 600    # Dashboard warmup data (default: 10 minutes)
  hot_ttl: 30       # Hot-path data like ban info (default: 30 seconds)
  table_ttl: 120    # Paginated dashboard tables (default: 2 minutes)
  # Read credentials from an externally-managed Secret. `name` empty = use the
  # chart-managed Secret built from `password` above. Any connection key left
  # empty falls back to the plaintext value above.
  # Setting `name` skips the chart-managed redis Secret; the Krawl Deployment
  # and the bundled StatefulSet both read from it. Combine with
  # `redis.enabled: false` for a fully external instance.
  existingSecret:
    name: ""
    passwordKey: "redis-password"
    hostKey: ""
    portKey: ""
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    # storageClassName: ""
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Optional bundled local LLM services (Ollama and/or llama.cpp)
# When enabled, point config.ai.openai_base_url to http://<release-name>-ollama:8080/v1
# or http://<release-name>-llamacpp:8080/v1
llm:
  ollama:
    enabled: false
    image:
      repository: ollama/ollama
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      port: 8080
    persistence:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
    model: "qwen:1.8b"
    pullModel: true
  llamaCpp:
    enabled: false
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server
      pullPolicy: IfNotPresent
    service:
      port: 8080
    persistence:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
    hfRepo: "Qwen/Qwen1.5-1.8B-Chat-GGUF"
    hfFile: "qwen1_5-1_8b-chat-q4_k_m.gguf"

# SQLite -> PostgreSQL migration job settings
migration:
  enabled: false
  # SQLite filename inside the PVC (default: krawl.db)
  sqliteFilename: "krawl.db"
  # Rows per batch insert
  batchSize: 1000
  # Drop existing PostgreSQL tables before migrating
  dropExisting: false
  # Use a specific existing PVC (defaults to <release>-krawl-db)
  # existingClaim: ""
  # Job retry limit
  backoffLimit: 3
  # Auto-cleanup job after completion (seconds)
  ttlSecondsAfterFinished: 3600

# Database persistence configuration (only used when mode=standalone)
database:
  # Persistence configuration
  persistence:
    enabled: true
    # Storage class name (use default if not specified)
    # storageClassName: ""
    # Access mode for the persistent volume
    accessMode: ReadWriteOnce
    # Size of the persistent volume
    size: 1Gi
    # Optional: Use existing PVC
    # existingClaim: ""

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - podSelector: {}
      - namespaceSelector: {}
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 5000
  egress:
    - to:
      - namespaceSelector: {}
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
      - protocol: UDP
