{{- if and .Values.dashboardPassword (not .Values.dashboardExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "krawl.fullname" . }}-dashboard
  labels:
    {{- include "krawl.labels" . | nindent 4 }}
type: Opaque
stringData:
  dashboard-password: {{ .Values.dashboardPassword | quote }}
{{- end }}
