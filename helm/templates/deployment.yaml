apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krawl.fullname" . }}
  labels:
    {{- include "krawl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.mode "scalable" }}
    type: RollingUpdate
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "krawl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "krawl.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: krawl
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.mode "scalable" }}
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z {{ .Values.postgres.host }} {{ .Values.postgres.port }}; do
              echo "Waiting for PostgreSQL at {{ .Values.postgres.host }}:{{ .Values.postgres.port }}..."
              sleep 2
            done
            echo "PostgreSQL is ready."
      {{- end }}
      containers:
      - name: krawl
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.server.port }}
          protocol: TCP
        env:
        - name: CONFIG_LOCATION
          value: "config.yaml"
        {{- if .Values.timezone }}
        - name: TZ
          value: {{ .Values.timezone | quote }}
        {{- end }}
        {{- if or .Values.dashboardPassword .Values.dashboardExistingSecret.name }}
        - name: KRAWL_DASHBOARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.dashboard.secret" . | fromJson).name }}
              key: {{ (include "krawl.dashboard.secret" . | fromJson).key }}
        {{- end }}
        {{- $dashPath := include "krawl.dashboardPath.secret" . | fromJson }}
        {{- if $dashPath.name }}
        - name: KRAWL_DASHBOARD_SECRET_PATH
          valueFrom:
            secretKeyRef:
              name: {{ $dashPath.name }}
              key: {{ $dashPath.key }}
        {{- end }}
        {{- if or .Values.config.ai.api_key .Values.aiExistingSecret.name }}
        - name: KRAWL_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.ai.secret" . | fromJson).name }}
              key: {{ (include "krawl.ai.secret" . | fromJson).key }}
        {{- end }}
        {{- if or .Values.config.map.api_key .Values.mapExistingSecret.name }}
        - name: KRAWL_MAP_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.map.secret" . | fromJson).name }}
              key: {{ (include "krawl.map.secret" . | fromJson).key }}
        {{- end }}
        {{- $canary := include "krawl.canary.secret" . | fromJson }}
        {{- if $canary.name }}
        - name: KRAWL_CANARY_TOKEN_URL
          valueFrom:
            secretKeyRef:
              name: {{ $canary.name }}
              key: {{ $canary.key }}
        {{- end }}
        {{- if or .Values.cloudflare.existingSecret.name .Values.cloudflare.accountId .Values.cloudflare.authToken }}
        - name: KRAWL_CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "krawl.cloudflare.secret" . }}
              key: {{ .Values.cloudflare.existingSecret.accountIdKey | default "cloudflare-account-id" }}
        - name: KRAWL_CLOUDFLARE_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "krawl.cloudflare.secret" . }}
              key: {{ .Values.cloudflare.existingSecret.authTokenKey | default "cloudflare-auth-token" }}
        - name: KRAWL_CLOUDFLARE_ENABLED
          value: {{ .Values.cloudflare.enabled | quote }}
        {{- end }}
        {{- if .Values.customTemplate.enabled }}
        - name: KRAWL_CUSTOM_TEMPLATE_PATH
          value: "/etc/krawl/templates/custom_page.html"
        {{- end }}
        {{- if eq .Values.mode "scalable" }}
        {{- $pg := include "krawl.postgres.secret" . | fromJson }}
        {{- $rd := include "krawl.redis.secret" . | fromJson }}
        - name: KRAWL_MODE
          value: "scalable"
        - name: KRAWL_POSTGRES_HOST
          {{- if .Values.postgres.existingSecret.hostKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $pg.name }}
              key: {{ .Values.postgres.existingSecret.hostKey }}
          {{- else }}
          value: {{ .Values.postgres.host | quote }}
          {{- end }}
        - name: KRAWL_POSTGRES_PORT
          {{- if .Values.postgres.existingSecret.portKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $pg.name }}
              key: {{ .Values.postgres.existingSecret.portKey }}
          {{- else }}
          value: {{ .Values.postgres.port | quote }}
          {{- end }}
        - name: KRAWL_POSTGRES_USER
          {{- if .Values.postgres.existingSecret.userKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $pg.name }}
              key: {{ .Values.postgres.existingSecret.userKey }}
          {{- else }}
          value: {{ .Values.postgres.user | quote }}
          {{- end }}
        - name: KRAWL_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.postgres.secret" . | fromJson).name }}
              key: {{ (include "krawl.postgres.secret" . | fromJson).key }}
        - name: KRAWL_POSTGRES_DATABASE
          {{- if .Values.postgres.existingSecret.databaseKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $pg.name }}
              key: {{ .Values.postgres.existingSecret.databaseKey }}
          {{- else }}
          value: {{ .Values.postgres.database | quote }}
          {{- end }}
        - name: KRAWL_REDIS_HOST
          {{- if .Values.redis.existingSecret.hostKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $rd.name }}
              key: {{ .Values.redis.existingSecret.hostKey }}
          {{- else }}
          value: {{ .Values.redis.host | quote }}
          {{- end }}
        - name: KRAWL_REDIS_PORT
          {{- if .Values.redis.existingSecret.portKey }}
          valueFrom:
            secretKeyRef:
              name: {{ $rd.name }}
              key: {{ .Values.redis.existingSecret.portKey }}
          {{- else }}
          value: {{ .Values.redis.port | quote }}
          {{- end }}
        - name: KRAWL_REDIS_DB
          value: {{ .Values.redis.db | quote }}
        {{- if or .Values.redis.password .Values.redis.existingSecret.name }}
        - name: KRAWL_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.redis.secret" . | fromJson).name }}
              key: {{ (include "krawl.redis.secret" . | fromJson).key }}
        {{- end }}
        - name: KRAWL_REDIS_CACHE_TTL
          value: {{ .Values.redis.cache_ttl | default 600 | quote }}
        - name: KRAWL_REDIS_HOT_TTL
          value: {{ .Values.redis.hot_ttl | default 30 | quote }}
        - name: KRAWL_REDIS_TABLE_TTL
          value: {{ .Values.redis.table_ttl | default 120 | quote }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraEnvFrom }}
        envFrom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: wordlists
          mountPath: /app/wordlists.json
          subPath: wordlists.json
          readOnly: true
        {{- if .Values.customTemplate.enabled }}
        - name: custom-template
          mountPath: /etc/krawl/templates
          readOnly: true
        {{- end }}
        {{- if and .Values.database.persistence.enabled (ne .Values.mode "scalable") }}
        - name: database
          mountPath: /app/data
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        startupProbe:
          {{- $secret := .Values.config.dashboard.secret_path }}
          {{- if $secret }}
          # Probe the health endpoint under the secret dashboard prefix, which
          # is exempt from ban/deception tracking. Path is built dynamically
          # from config.dashboard.secret_path.
          httpGet:
            path: /{{ $secret | trimPrefix "/" | trimSuffix "/" }}/healthz
            port: http
          {{- else }}
          # secret_path is auto-generated at runtime and unknowable here, so the
          # HTTP health path can't be templated. Fall back to a TCP check, which
          # verifies the server is up without hitting the honeypot catch-all.
          tcpSocket:
            port: http
          {{- end }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: {{ include "krawl.fullname" . }}-config
      - name: wordlists
        configMap:
          name: {{ include "krawl.fullname" . }}-wordlists
      {{- if .Values.customTemplate.enabled }}
      - name: custom-template
        configMap:
          name: {{ include "krawl.fullname" . }}-custom-template
      {{- end }}
      {{- if and .Values.database.persistence.enabled (ne .Values.mode "scalable") }}
      - name: database
        {{- if .Values.database.persistence.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.database.persistence.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "krawl.fullname" . }}-db
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}