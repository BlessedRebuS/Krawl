{{- if .Values.postgres.enabled }}
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "krawl.fullname" . }}-postgres
  labels:
    {{- include "krawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - {{ .Values.postgres.persistence.accessMode }}
  {{- if .Values.postgres.persistence.storageClassName }}
  storageClassName: {{ .Values.postgres.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.host }}
  labels:
    {{- include "krawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: {{ include "krawl.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "krawl.fullname" . }}-postgres
  labels:
    {{- include "krawl.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Values.postgres.host }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "krawl.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "krawl.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
        {{- with .Values.postgres.config }}
        # The image entrypoint forwards a leading `-` argument to the server,
        # so these become postgres command-line settings. Sorted for a stable
        # rendering, or every `helm upgrade` shows a spurious diff.
        args:
          {{- range $key := (keys . | sortAlpha) }}
          {{- $value := index $.Values.postgres.config $key }}
          {{- if $value }}
          - -c
          - {{ printf "%s=%v" $key $value | quote }}
          {{- end }}
          {{- end }}
        {{- end }}
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: {{ .Values.postgres.database | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ (include "krawl.postgres.secret" . | fromJson).name }}
              key: {{ (include "krawl.postgres.secret" . | fromJson).key }}
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        {{- if .Values.postgres.persistence.enabled }}
        - name: data
          mountPath: /var/lib/postgresql/data
        {{- end }}
        {{- if .Values.postgres.shmSize }}
        - name: dshm
          mountPath: /dev/shm
        {{- end }}
        {{- with .Values.postgres.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - {{ .Values.postgres.user | quote }}
              - -d
              - {{ .Values.postgres.database | quote }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - {{ .Values.postgres.user | quote }}
              - -d
              - {{ .Values.postgres.database | quote }}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      {{- if .Values.postgres.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "krawl.fullname" . }}-postgres
      {{- end }}
      {{- if .Values.postgres.shmSize }}
      # Kubernetes gives a container 64Mi of /dev/shm, which PostgreSQL uses
      # for the dynamic shared memory segments that parallel workers allocate.
      # A parallel VACUUM takes one segment per index, so a table with several
      # large indexes overruns the default and the vacuum dies with
      # "could not resize shared memory segment ... No space left on device".
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.postgres.shmSize }}
      {{- end }}
{{- end }}
